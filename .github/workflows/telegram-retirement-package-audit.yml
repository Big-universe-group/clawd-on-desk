name: Five-target Package Audit

on:
  workflow_call:
  pull_request:
    paths:
      - ".gitignore"
      - "package.json"
      - "package-lock.json"
      - "src/main.js"
      - "src/features/mobile/preview-lifecycle.js"
      - "src/features/mobile/preview-server.js"
      - "src/ui/pet/pet-window-runtime.js"
      - "src/ui/pet/topmost-runtime.js"
      - "src/platform/win/hit-window-activation.js"
      - "src/runtime/recap/*.js"
      - "src/platform/koffi/package-contract.js"
      - "src/platform/koffi/native-package-target.js"
      - "src/platform/koffi/package-smoke.js"
      - "src/platform/mac/window.js"
      - "src/platform/win/cloak-recovery.js"
      - "src/platform/win/foreground-terminal.js"
      - "src/platform/win/fullscreen-detect.js"
      - "src/core/settings/actions.js"
      - "src/core/i18n/settings-i18n.js"
      - "src/ui/settings/ui-core.js"
      - "src/ui/settings/language-picker.js"
      - "src/ui/settings/language-picker.css"
      - "src/ui/settings/tabs/theme.js"
      - "src/ui/settings/tabs/recap.js"
      - "src/features/telegram/**"
      - "src/ui/settings/tabs/telegram-approval.js"
      - "src/ui/settings/settings.css"
      - "src/agents/traecode/descriptor.js"
      - "hooks/traecode-*"
      - "src/agents/minimax/descriptor.js"
      - "hooks/minimax-*"
      - "src/runtime/state/stale-cleanup.js"
      - "src/runtime/state/state.js"
      - "src/agents/integration-sync.js"
      - "src/agents/doctor/descriptors.js"
      - "test/hooks/traecode/traecode-*.test.js"
      - "test/hooks/minimax/minimax-*.test.js"
      - "test/runtime/recap/recap*.test.js"
      - "test/fixtures/recap-private-permissions-*.js"
      - "test/runtime/state/state-stale-cleanup.test.js"
      - "test/agents/integration-sync.test.js"
      - "test/features/doctor/doctor-agent-descriptors.test.js"
      - "test/features/doctor/doctor-agent-integrations.test.js"
      - "test/core/server/server-hook-management.test.js"
      - "test/hooks/shared/hook-adapter-offline-contract.test.js"
      - "test/features/accessories/accessory-motion-electron.test.js"
      - "test/fixtures/accessory-motion-electron.js"
      - "scripts/assert-no-retired-telegram-sidecar.js"
      - "scripts/audit-repository-assets.js"
      - "scripts/after-pack-koffi.js"
      - "scripts/audit-packaged-native.js"
      - "scripts/native-package-policy.json"
      - "scripts/run-packaged-koffi-smoke.js"
      - "scripts/verify-updater-metadata.js"
      - "test/repo/assert-no-retired-telegram-sidecar.test.js"
      - "test/repo/after-pack-koffi.test.js"
      - "test/repo/audit-packaged-native.test.js"
      - "test/platform/koffi/koffi-lockfile.test.js"
      - "test/platform/koffi/native-package-target.test.js"
      - "test/platform/koffi/package-koffi-smoke.test.js"
      - "test/repo/package-build-config.test.js"
      - "test/features/mobile/mobile-preview-lifecycle.test.js"
      - "test/features/mobile/mobile-preview-server.test.js"
      - "test/ui/pet/pet-window-runtime.test.js"
      - "test/ui/pet/topmost-runtime.test.js"
      - "test/platform/win/win-hit-window-activation.test.js"
      - "test/repo/verify-updater-metadata.test.js"
      - "test/platform/win/win-foreground-terminal.test.js"
      - "test/platform/win/win-fullscreen-detect.test.js"
      - "test/ui/settings/settings-renderer-browser-env.test.js"
      - "test/ui/settings/settings-picker-layout-electron.test.js"
      - "test/fixtures/settings-picker-layout-electron.js"
      - "test/ui/settings/settings-recap.test.js"
      - "test/features/telegram/telegram-legacy-retirement.test.js"
      - "test/features/telegram/telegram-migration-*.test.js"
      - ".github/workflows/build.yml"
      - ".github/workflows/telegram-retirement-package-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: |
          node --test \
            test/repo/assert-no-retired-telegram-sidecar.test.js \
            test/repo/after-pack-koffi.test.js \
            test/repo/appimage-apprun.test.js \
            test/repo/audit-packaged-native.test.js \
            test/repo/dependency-security-floor.test.js \
            test/platform/koffi/koffi-lockfile.test.js \
            test/platform/koffi/native-package-target.test.js \
            test/features/mobile/mobile-preview-lifecycle.test.js \
            test/features/mobile/mobile-preview-server.test.js \
            test/platform/koffi/package-koffi-smoke.test.js \
            test/repo/package-build-config.test.js \
            test/ui/pet/pet-window-runtime.test.js \
            test/features/telegram/telegram-legacy-retirement.test.js \
            test/features/telegram/telegram-migration-state.test.js \
            test/features/telegram/telegram-migration-controller.test.js \
            test/features/telegram/telegram-migration-user-data.test.js \
            test/repo/verify-updater-metadata.test.js \
            test/platform/win/win-foreground-terminal.test.js \
            test/platform/win/win-fullscreen-detect.test.js \
            test/platform/win/win-hit-window-activation.test.js \
            test/ui/pet/topmost-runtime.test.js
      - name: Run TraeCode integration tests
        run: |
          node --test \
            test/hooks/traecode/traecode-hook.test.js \
            test/hooks/traecode/traecode-install.test.js \
            test/agents/registry.test.js \
            test/runtime/state/state-stale-cleanup.test.js \
            test/agents/integration-sync.test.js \
            test/features/doctor/doctor-agent-descriptors.test.js \
            test/features/doctor/doctor-agent-integrations.test.js \
            test/core/server/server-hook-management.test.js \
            test/ui/settings/settings-renderer-browser-env.test.js \
            test/hooks/shared/hook-adapter-offline-contract.test.js
      - name: Run MiniMax Code integration tests
        run: |
          node --test \
            test/hooks/minimax/minimax-hook.test.js \
            test/hooks/minimax/minimax-install.test.js \
            test/agents/registry.test.js \
            test/agents/integration-sync.test.js \
            test/features/doctor/doctor-agent-descriptors.test.js \
            test/features/doctor/doctor-agent-integrations.test.js \
            test/core/server/server-hook-management.test.js \
            test/ui/settings/settings-renderer-browser-env.test.js \
            test/hooks/shared/hook-adapter-offline-contract.test.js
      - name: Run recap unit tests
        run: >-
          node --test
          test/runtime/recap/recap*.test.js
          test/ui/settings/settings-recap.test.js
      - name: Run Settings picker layout under Electron
        run: xvfb-run -a node --test test/ui/settings/settings-picker-layout-electron.test.js
      - name: Run native SVG motion audit
        run: xvfb-run -a node --test test/features/accessories/accessory-motion-electron.test.js

  package:
    needs: unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            build_script: build:win:x64
            app_root: dist/win-unpacked
            executable: dist/win-unpacked/Clawd on Desk.exe
            smoke_extra: ""
            resources_root: dist/win-unpacked/resources
            artifact_check_glob: dist/Clawd-on-Desk-Setup-*-x64.exe
            artifact_glob: dist/Clawd-on-Desk-Setup-*-x64.exe
          - target: windows-arm64
            runner: windows-11-arm
            build_script: build:win:arm64
            app_root: dist/win-arm64-unpacked
            executable: dist/win-arm64-unpacked/Clawd on Desk.exe
            smoke_extra: ""
            resources_root: dist/win-arm64-unpacked/resources
            artifact_check_glob: dist/Clawd-on-Desk-Setup-*-arm64.exe
            artifact_glob: dist/Clawd-on-Desk-Setup-*-arm64.exe
          - target: darwin-x64
            runner: macos-15-intel
            build_script: build:mac:x64
            app_root: dist/mac/Clawd on Desk.app
            executable: dist/mac/Clawd on Desk.app/Contents/MacOS/Clawd on Desk
            smoke_extra: ""
            resources_root: dist/mac/Clawd on Desk.app/Contents/Resources
            artifact_check_glob: dist/Clawd-on-Desk-*-x64.dmg
            artifact_glob: dist/Clawd-on-Desk-*-x64.dmg
          - target: darwin-arm64
            runner: macos-latest
            build_script: build:mac:arm64
            app_root: dist/mac-arm64/Clawd on Desk.app
            executable: dist/mac-arm64/Clawd on Desk.app/Contents/MacOS/Clawd on Desk
            smoke_extra: ""
            resources_root: dist/mac-arm64/Clawd on Desk.app/Contents/Resources
            artifact_check_glob: dist/Clawd-on-Desk-*-arm64.dmg
            artifact_glob: dist/Clawd-on-Desk-*-arm64.dmg
          - target: linux-x64
            runner: ubuntu-latest
            build_script: build:linux:x64
            app_root: dist/linux-unpacked
            executable: dist/linux-unpacked/clawd-on-desk
            smoke_extra: "--xvfb"
            resources_root: dist/linux-unpacked/resources
            artifact_check_glob: dist/Clawd-on-Desk-*-x86_64.AppImage
            artifact_glob: |
              dist/Clawd-on-Desk-*-x86_64.AppImage
              dist/Clawd-on-Desk-*-amd64.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Run Windows recap ACL tests
        if: runner.os == 'Windows'
        run: >-
          node --test
          test/runtime/recap/recap-private-permissions.test.js
          test/runtime/recap/recap-private-permissions-electron.test.js
          test/runtime/recap/recap-runtime.test.js
          test/runtime/recap/recap-store.test.js
      - run: npm run ${{ matrix.build_script }} -- --publish never
      - name: Assert installer exists
        shell: bash
        run: |
          shopt -s nullglob
          matches=( ${{ matrix.artifact_check_glob }} )
          if (( ${#matches[@]} == 0 )); then
            echo "Missing built artifact: ${{ matrix.artifact_check_glob }}" >&2
            exit 1
          fi
      - run: >-
          node scripts/assert-no-retired-telegram-sidecar.js
          --resources-root "${{ matrix.resources_root }}"
          --output "dist/telegram-retirement-manifests/${{ matrix.target }}.json"
      - name: Audit packaged native payloads
        run: >-
          node scripts/audit-packaged-native.js
          --app-root "${{ matrix.app_root }}"
          --target "${{ matrix.target }}"
          --output "dist/native-package-manifests/${{ matrix.target }}.json"
      - name: Configure Linux Chromium sandbox
        if: matrix.target == 'linux-x64'
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Run packaged Koffi smoke
        run: >-
          node scripts/run-packaged-koffi-smoke.js
          --executable "${{ matrix.executable }}"
          --target "${{ matrix.target }}"
          --output "dist/koffi-smoke/${{ matrix.target }}.json"
          ${{ matrix.smoke_extra }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-audit-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_glob }}
            dist/koffi-prune-manifests/*.json
            dist/koffi-smoke/*.json
            dist/native-package-manifests/*.json
            dist/telegram-retirement-manifests/*.json
          if-no-files-found: error
          retention-days: 7
