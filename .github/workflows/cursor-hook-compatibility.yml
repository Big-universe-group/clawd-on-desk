name: Cursor Hook Compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/cursor-hook-compatibility.yml"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "hooks/cursor-*.js"
      - "hooks/shared-process.js"
      - "hooks/server-config.js"
      - "hooks/json-utils.js"
      - "src/features/remote-ssh/deploy.js"
      - "test/hooks/cursor-agent/*.test.js"
      - "test/hooks/shared/shared-process.test.js"
      - "test/helpers/spawned-hook.js"
      - "test/helpers/hook-post-recorder.js"
      - "test/helpers/cursor-hook-delivery-probe.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runtime: [project, node-22-floor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'project'
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node-22-floor'
        with:
          node-version: '22.12.0'
      - run: npm ci
      - name: Test Cursor hooks, title delivery, and dependency closure
        run: >-
          node --test
          test/hooks/cursor-agent/cursor-hook-delivery.test.js
          test/hooks/cursor-agent/cursor-install.test.js
          test/hooks/cursor-agent/cursor-session-title.test.js
          test/hooks/claude-code/remote-deploy.test.js
          test/hooks/shared/hook-adapter-b1a-contract.test.js
          test/hooks/shared/hook-adapter-offline-contract.test.js
          test/hooks/shared/hook-pid-cache-contexts.test.js
          test/features/doctor/doctor-node-bin-parser.test.js
          test/features/doctor/doctor-find-hook-commands.test.js
      - name: Verify the unchanged production stdin read deadline
        run: node --test --test-name-pattern=readStdinJson test/hooks/shared/shared-process.test.js
      - name: Exercise SQLite on the supported Node 22.12 floor
        if: matrix.runtime == 'node-22-floor'
        run: node --experimental-sqlite --test test/hooks/cursor-agent/cursor-session-title.test.js test/hooks/claude-code/remote-deploy.test.js
